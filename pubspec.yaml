    - assets/images/forya/
    - assets/images/oumi/
    - assets/images/yaychat/
    - assets/images/yaychat/actions/
    - assets/images/oumi/car/
    - assets/images/oumi/charge/
    - assets/images/oumi/chat/
    - assets/images/oumi/dialog/
    - assets/images/oumi/home/
    - assets/images/oumi/intimacy/
    - assets/images/oumi/ka/
    - assets/images/oumi/mine/
    - assets/images/oumi/msg/
    - assets/images/oumi/rank/
    - assets/images/oumi/room/
    - assets/images/oumi/room/story/
    - assets/images/oumi/room/tool/
    - assets/images/oumi/tab/
