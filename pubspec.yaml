name: chimo
description: "Chimo — groups & community."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  provider: ^6.1.5
  go_router: ^16.0.0
  path_provider: ^2.1.5
  image_picker: ^1.2.3
  photo_manager: ^3.6.4
  http: ^1.6.0
  shared_preferences: ^2.5.5
  audioplayers: ^6.4.0
  record: ^6.0.0
  # Path-vendor EaseMob IM (same SDK as forya; Android via pub, iOS via forya_im).
  im_flutter_sdk:
    path: ../../forya/joyride_flutter/third_party/im_flutter_sdk-4.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/forya/
    - assets/json/
