name: chimo
description: "Chimo — groups & community."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  provider: ^6.1.5
  go_router: ^16.0.0
  path_provider: ^2.1.5
  image_picker: ^1.2.3
  photo_manager: ^3.6.4
  http: ^1.6.0
  shared_preferences: ^2.5.5
  audioplayers: ^6.4.0
  record: ^6.0.0
  webview_flutter: ^4.13.0
  # EaseMob IM（pub.dev；需主包与 ios/android/interface 版本一致）
  im_flutter_sdk: 4.19.3
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  # 个人主页打开特效（对齐 forya PAGView.network(cardDynamicResource)）
  forya_pag:
    path: third_party/pag-flutter
  visibility_detector: ^0.4.0+2
  # iOS Sign in with Apple（对齐 forya apple_login_platform）
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  dio: ^5.11.0
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/forya/
    - assets/json/
  fonts:
    - family: Emoji
      fonts:
        - asset: assets/fonts/EmojiFont.ttf
