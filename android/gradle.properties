# Xmx 对齐 joyride；CompileCommand 规避 Android Studio JBR 17.0.6 (aarch64)
# 在 JIT 编译 FirKotlinUastResolveProviderService 时的 C1 崩溃（Field too big for insn）。
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -XX:CompileCommand=exclude,org.jetbrains.uast.kotlin.FirKotlinUastResolveProviderService::resolveSyntheticJavaPropertyAccessorCall
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

kotlin.incremental=false
